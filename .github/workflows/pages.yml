name: Site

# gsecs.taptappers.club: site/ plus a bond list compiled from data/ on every deploy, so the
# calendar is never older than the dataset. The daily "Update data" run commits through the API,
# which starts no push workflow; workflow_run picks those commits up instead.
on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/scripts/bonds.py', '.github/tests/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', '.github/scripts/bonds.py', '.github/tests/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Update data']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Test the calendar's arithmetic
        run: node --test .github/tests/*.test.mjs
      - name: Compile the bond list from data/
        run: python3 .github/scripts/bonds.py site/bonds.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
